name: KIND Disclosure Daily Collector

on:
  schedule:
    # 평일 한국 시간 20:15 (UTC 11:15). GitHub 예약 실행은 지연될 수 있음.
    - cron: '15 11 * * 1-5'
  repository_dispatch:
    types: [trigger_collector]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-collector
  cancel-in-progress: false

jobs:
  collect_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 환경변수 확인
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL Secret이 필요합니다"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY$SUPABASE_KEY" || { echo "::error::Supabase 쓰기 키 Secret이 필요합니다"; exit 1; }

      - name: KIND 최신 공시 다운로드 및 Supabase 적재
        run: |
          python read_excel_auto.py --auto --no-report
